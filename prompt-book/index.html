<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a controlled-document binder — doc-control header, sticky chapter tabs, prompt cards as numbered clauses. */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #142033;
  --muted: #5b6678;
  --rule: #dde2ea;
  --navy: #1f3a68;
  --navy-soft: #e7edf7;
  --marker: #ffd84d;
  --code-bg: #f1f4f9;
  --ok: #1d7a4f;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1420; --sheet: #151d2c; --ink: #e6ebf3; --muted: #9aa6b8; --rule: #263247;
    --navy: #8fb0ea; --navy-soft: #1c2940; --marker: #ffd84d; --code-bg: #0f1724; --ok: #5cc795;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1420; --sheet: #151d2c; --ink: #e6ebf3; --muted: #9aa6b8; --rule: #263247;
  --navy: #8fb0ea; --navy-soft: #1c2940; --marker: #ffd84d; --code-bg: #0f1724; --ok: #5cc795;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 8px; }
.doc-ctrl { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 4px 18px; font: 500 11px/1.4 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-top: 3px solid var(--navy); padding-top: 10px; }
.doc-ctrl b { color: var(--ink); font-weight: 500; }
h1 { font: 700 clamp(30px, 6vw, 46px)/1.05 var(--f-display); margin: 18px 0 10px; text-wrap: balance; letter-spacing: -.01em; }
h1 mark { background: linear-gradient(transparent 58%, var(--marker) 58%); color: inherit; padding: 0 2px; }
.sub { color: var(--muted); max-width: 62ch; margin: 0; }
.formula { margin-top: 26px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; }
.formula h2 { font: 700 18px/1.2 var(--f-display); margin: 0 0 4px; }
.formula p { margin: 0 0 14px; color: var(--muted); }
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.part { border-left: 3px solid var(--navy); padding: 4px 0 4px 12px; min-width: 0; }
.part strong { display: block; font: 600 13px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--navy); }
.part span { display: block; font-size: 14px; }
.part em { display: block; font: 12.5px/1.45 var(--f-mono); font-style: normal; color: var(--muted); margin-top: 2px; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); margin-top: 22px; }
.tabs-inner { display: flex; gap: 8px; align-items: center; padding-block: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs-inner::-webkit-scrollbar { display: none; }
.search { flex: 0 0 170px; font: 14px var(--f-body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; }
.search:focus-visible, .chip:focus-visible, button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.chip { flex: 0 0 auto; font: 500 13px var(--f-body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--sheet); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .7; margin-left: 4px; }
main { padding-block: 10px 60px; }
section.chapter { margin-top: 30px; }
.ch-head { display: flex; align-items: baseline; gap: 12px; }
.ch-num { font: 500 13px var(--f-mono); color: var(--navy); }
.ch-head h2 { font: 700 24px/1.15 var(--f-display); margin: 0; }
.ch-blurb { color: var(--muted); margin: 4px 0 14px; max-width: 62ch; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; margin-bottom: 12px; min-width: 0; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.card h3 { font: 600 16.5px/1.3 var(--f-body); margin: 0; }
.card h3 .id { font: 500 12px var(--f-mono); color: var(--muted); margin-right: 6px; }
.use { color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.lang button { font: 500 12px var(--f-mono); background: transparent; color: var(--muted); border: 0; padding: 4px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--navy-soft); color: var(--navy); }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; font: 13.5px/1.55 var(--f-mono); white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
pre .ph { background: color-mix(in srgb, var(--marker) 45%, transparent); border-radius: 3px; padding: 0 2px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.tip { font-size: 13.5px; color: var(--muted); flex: 1 1 260px; min-width: 0; }
.tip b { color: var(--ink); font-weight: 600; }
.copy { font: 600 13px var(--f-body); background: var(--navy); color: var(--sheet); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.copy.done { background: var(--ok); }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); padding-block: 18px 40px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<footer class="wrap">Words in <span style="background:color-mix(in srgb, var(--marker) 45%, transparent);padding:0 3px;border-radius:3px">[brackets]</span> are yours to fill in. Tap BM to switch a prompt to Bahasa Melayu.</footer>

<script>
const DATA = {"title": "Zuraidah's Claude Prompt Book", "subtitle": "Ready-to-copy prompts built from the work you already ask Claude to do: video edits, compliance documents, production and stock reports, LinkedIn content, training modules and your Rumah Kita game.", "formula": {"name": "The 6-part prompt formula", "intro": "Every strong prompt in this book follows the same shape. When you write a new one, fill these six slots and delete the ones you don't need.", "parts": [["Role", "Who Claude should act as.", "Act as my video editor for short safety videos."], ["Task", "The one job, with a measurable target.", "Edit this video to under 2 minutes."], ["Input", "What you are giving it: files, notes, links, month.", "Attached: ERT_drill.mp4 (6 min, Malay speech)."], ["Output", "File type, format, language, length.", "9:16 MP4, BM captions, max 30 MB."], ["Rules", "What must or must not happen.", "Keep my original voice. No made-up statistics."], ["Checkpoint", "Where Claude stops and shows you first.", "Show me a preview page before rendering."]]}, "chapters": [{"id": "video", "name": "Video", "blurb": "Editing, hooks, captions, colour grade and AI-generated clips. Always ask for a preview before the final render.", "prompts": [{"title": "Premium edit under a time limit", "use": "You have a long raw video and want it tight, clean and premium.", "prompt": "Edit this video to under [5] minutes.\n- Transcribe it with timestamps.\n- Cut awkward pauses, false starts and repeated points. Tell me what you cut and why.\n- Add a strong hook in the first 5-10 seconds.\n- Add SFX, motion (slow push-ins, punch zooms on the hook) and kinetic captions.\n- Colour grade it premium and fix dark shots, but protect skin tones and white slides.\n- Keep my original audio. Do NOT add a new voice unless I say yes.\nShow me a preview page first (transcript with cuts, hook storyboard, before/after grade stills, old vs new length). Render only after I approve.", "bm": "Edit video ni bawah [5] minit. Buang awkward pause dan ayat berulang, letak hook, SFX, motion dan colour grade premium. Kekalkan suara asal. Tunjuk preview dulu sebelum render.", "tip": "Your premium-video-edit skill picks this up automatically. The word 'preview' is what stops it from rendering too early."}, {"title": "Hook only", "use": "The video is fine but the first seconds are weak.", "prompt": "Write 3 hook options for the first 5 seconds of this video about [topic].\nFor each: the on-screen text (max 6 words), the SFX, and the 3 fast cuts to use from my footage (give timestamps).\nNo statistics I haven't given you. Audience: [factory workers / LinkedIn / buyers].", "bm": "Bagi 3 pilihan hook 5 saat pertama untuk video [topik]. Teks atas skrin max 6 patah perkataan, SFX, dan 3 potongan laju dari footage saya.", "tip": "Pick one, then paste it into the premium edit prompt."}, {"title": "Bilingual captions (BM + EN)", "use": "One video, two language versions.", "prompt": "Make two versions of this video: Bahasa Melayu and English.\n- Captions from the real speech (fix spelling, keep the speaker's words).\n- Vertical 1080x1920, captions bold with black stroke, current word highlighted yellow, max 2 lines.\n- Keep captions clear of the TikTok/Reels buttons.\nShow one frame from each version before rendering.", "bm": "Buat dua versi video ni: BM dan English. Caption ikut percakapan sebenar, 9:16, highlight perkataan semasa warna kuning.", "tip": "For BM wording, add: 'Check the BM against DBP standard spelling.'"}, {"title": "Safety / ERT training video from slides", "use": "Turning a training deck or procedure into a short video for staff.", "prompt": "Turn this [ERT / fire evacuation / HACCP] slide deck into a [2]-minute training video for factory staff.\n- One idea per scene, short lines.\n- Zoom and highlight the item being talked about on each slide.\n- Use Nadia from my Rumah Kita assets as the host, other characters as cameos. They must walk, never run, in evacuation scenes.\n- Fire alarm sound = electric bell, not a siren.\n- Ask me before adding any narration voice.\nOutput: BM and EN versions, 9:16. Preview first.", "bm": "Tukar slide [ERT] ni jadi video latihan [2] minit untuk staff kilang. Guna Nadia sebagai host. Tanya saya dulu sebelum letak suara.", "tip": "Only safe, general guidance goes into narration. Ask Claude to flag any number it could not verify."}, {"title": "Talking-head clean-up", "use": "Interview or phone video with bad sound or low quality.", "prompt": "Clean up this talking-head video.\n- Remove background noise, hum and echo. Make the voice loud enough for phones.\n- Improve the picture (it was downloaded from [WhatsApp / LinkedIn]).\n- Add my name and title as a lower third: \"Dr. Zuraidah Zainudin, Compliance & Project Manager\".\n- Add the Impact Rank logo as a small watermark, top right.\nTell me first what is wrong with the sound before fixing it.", "bm": "Bersihkan audio video ni (bunyi bising, gema), perbaiki kualiti gambar, letak nama dan logo Impact Rank.", "tip": "Uses your video-cleanup skill."}, {"title": "AI video clip from a text idea", "use": "You need a short generated clip (anime, cinematic, comedy skit, product shot).", "prompt": "Generate a [8]-second [cinematic / anime / comedy skit] clip.\nScene: [who, where, what happens].\nCamera: [slow push-in / handheld / drone].\nMood and light: [warm morning / dramatic night].\nFormat: [9:16 vertical / 16:9].\nNo text in the video. Give me 2 variations before making a longer version.", "bm": "Jana klip video [8] saat gaya [sinematik / anime]. Babak: [siapa, di mana, apa berlaku]. Format 9:16. Bagi 2 variasi dulu.", "tip": "Describe the shot like a director: subject, action, camera, light, format."}, {"title": "Connect Claude Code with CapCut", "use": "You want Claude to build CapCut drafts you finish in the app.", "prompt": "I want Claude Code to create CapCut drafts for me on my [Windows / Mac] PC.\nWalk me through setting up a CapCut MCP server step by step, as if I have never used a terminal.\nTell me what each command does, what to install first (Node, ffmpeg), and what to do if it fails.\nRemind me of anything I must close or back up first.", "bm": "Ajar saya sambung Claude Code dengan CapCut langkah demi langkah. Anggap saya tak pernah guna terminal.", "tip": "CapCut has no official API. The community MCP servers write draft files, so close CapCut before Claude saves."}, {"title": "Video from a website or product page", "use": "Promo video of a page or app (e.g. Rumah Kita).", "prompt": "Make a [30]-second promo video of [link / my project].\nUse real screenshots of the page, smooth camera moves across them, cuts on the music beat, and a call-to-action end card: \"[text]\".\nFormat 16:9 and 9:16. Show the shot list first.", "bm": "Buat video promo [30] saat untuk [link]. Guna screenshot sebenar, gerakan kamera, potong ikut beat. Tunjuk senarai shot dulu.", "tip": "Uses the video-shotcraft skill."}]}, {"id": "social", "name": "LinkedIn & social", "blurb": "Posts in your voice, posts for James Chang, and 7-slide carousels from real Eng Dept photos.", "prompts": [{"title": "LinkedIn post in my voice", "use": "Turn an idea, photo or work moment into a post.", "prompt": "Write a LinkedIn post for me about [topic / what happened].\nMe: Compliance & Project Manager at Impact Rank (M) Sdn. Bhd., plastic packaging, Malaysia (ISO 9001, 14001, FSSC/HACCP).\n- Strong first line that makes people stop scrolling.\n- Short story, then 3 practical takeaways.\n- Warm-professional, not salesy. No made-up numbers.\n- End with one question to the reader. 5-8 hashtags.\nGive me 2 versions: short (~120 words) and long (~250 words).", "bm": "Tulis post LinkedIn tentang [topik] dalam gaya saya. Hook kuat, cerita pendek, 3 pengajaran. Bagi versi pendek dan panjang.", "tip": "Attach a photo description and Claude will build the story around it."}, {"title": "LinkedIn post for James Chang (MD)", "use": "Posts written for the boss.", "prompt": "Write a LinkedIn post for James Chang, Managing Director of Impact Rank (M) Sdn. Bhd., about [topic / event / milestone].\nTone: confident leader, thanks the team, speaks to customers and partners.\nKeep facts to what I give you: [facts].\nGive 2 versions and a suggested photo to post with it.", "bm": "Tulis post LinkedIn untuk James Chang (MD) tentang [topik]. Nada pemimpin, terima kasih kepada team.", "tip": "Mention 'for James' or 'for the MD' so the right voice is used."}, {"title": "7-slide carousel", "use": "Swipe post for LinkedIn or Instagram (1080x1350).", "prompt": "Build a 7-slide carousel about [topic, e.g. 5 checks before choosing a food-grade packaging supplier].\nAudience: [buyers / EU export customers / industry peers / job seekers].\nVoice: [my personal brand / company page].\nUse only real Eng Dept photos, logo and certificates. No AI images, no stock photos.\nAlso write the LinkedIn caption and hashtags.", "bm": "Buat carousel 7 slide tentang [topik]. Guna gambar sebenar Eng Dept sahaja. Sertakan caption dan hashtag.", "tip": "No topic? Say 'pick a topic I haven't covered yet' and Claude rotates through food safety, quality, ESG, EU export and OSH."}, {"title": "One idea, many posts", "use": "Plan a week of content from one topic.", "prompt": "From this topic: [topic], plan 5 LinkedIn posts for next week (Mon-Fri).\nFor each: the angle, the hook line, the format (text / carousel / photo / short video), and which real asset to use.\nMix: 1 story, 1 how-to, 1 myth vs fact, 1 behind-the-scenes, 1 question post.", "bm": "Dari topik [topik], rancang 5 post LinkedIn minggu depan (Isnin-Jumaat).", "tip": "Then ask for each post one by one with the prompts above."}]}, {"id": "design", "name": "Design & style", "blurb": "Make anything you build (pages, slides, carousels, game screens) follow one clear look, using a reusable style file. Method from Charlie Hills, \"How to make anything look like Apple with one Claude prompt\" (MarTech AI, Oct 2026).", "prompts": [{"title": "Apple-style anything (one prompt)", "use": "You want a page, slide or one-pager to look clean and premium like apple.com.", "prompt": "Build me [a landing page / a one-page product sheet / a training slide] about [topic] as ONE HTML file.\nFollow this style file exactly:\n- Fonts: system-ui / -apple-system, then Inter. Only 2-3 weights (400, 600, 700).\n- Colours: white #ffffff and light grey #f5f5f7 backgrounds, near-black #1d1d1f text, grey #6e6e73 for secondary text, ONE blue accent #0071e3 for links and buttons. No other colours.\n- Headlines very large and tight (56-80px, bold, slight negative letter-spacing). Body 17-19px, lots of white space.\n- Rounded corners: buttons fully rounded (pill), cards 18-24px.\n- Motion: subtle fade and rise only, slow and smooth (ease-out, 0.6-0.8s).\n- One idea per section, short sentences.\n- No logos, no photos, and do not mention Apple or any other brand.", "bm": "Bina [landing page / slaid] tentang [topik] sebagai SATU fail HTML gaya Apple: font system-ui/Inter, latar putih dan kelabu muda, teks hampir hitam, SATU warna biru sahaja, tajuk besar, banyak ruang kosong, sudut bulat, animasi perlahan. Tiada logo, gambar atau nama jenama.", "tip": "Adapted from Charlie Hills. He used a free tool called REA to pull this style from apple.com. The colours here are apple.com's usual ones, written by us, not his exact file."}, {"title": "Make a style file from any brand you love", "use": "You like how a website looks and want Claude to reuse that look every time.", "prompt": "Study the design of [website, e.g. a brand you admire] from the screenshots I attached.\nWrite a reusable style file I can paste into any Claude chat, with exact values for:\n1) fonts and weights, 2) colour palette with the role of each colour, 3) headline and body sizes, 4) spacing, 5) corner radius for buttons and cards, 6) shadows, 7) motion (speed and easing), 8) tone of the copy.\nEnd with a 'Do not' list. No logos, photos or brand names in the file.\nThen show me one sample section built with it.", "bm": "Kaji reka bentuk [laman web] dari screenshot yang saya lampirkan. Tulis 'style file' yang boleh saya guna semula: font, warna dan fungsinya, saiz tajuk, jarak, sudut bulat, bayang, animasi, nada ayat. Sertakan senarai 'Jangan'.", "tip": "Save the style file as a skill (see 'Turn a good chat into a skill') so you only need to say 'use my Apple style'."}, {"title": "Impact Rank house style", "use": "All your reports, carousels and pages should look the same.", "prompt": "Create an Impact Rank style file from our real materials: the logo, the dark-blue report title blocks, our proposal and our certificates (attached).\nInclude fonts, colours with their roles, table style, heading sizes, photo rules (real Eng Dept photos only, no AI images) and tone (warm-professional).\nThen restyle [this carousel / training module cover / Rumah Kita start screen] with it and show me before and after.", "bm": "Buat 'style file' Impact Rank dari bahan sebenar kami (logo, tajuk laporan biru gelap, proposal, sijil). Kemudian gayakan semula [carousel / modul latihan] dan tunjuk sebelum dan selepas.", "tip": "Once approved, paste it at the top of the carousel, training module and proposal prompts in this book."}]}, {"id": "compliance", "name": "Compliance & ISO", "blurb": "ISO 9001/14001/HACCP documents, audits, document control and certificates.", "prompts": [{"title": "ISO 14001:2026 compliance matrix", "use": "Gap analysis and transition plan.", "prompt": "Generate an ISO 14001:2026 compliance matrix and transition action plan for [organisation].\n- Clause by clause: what changed from 2015, what we have now, gap, action, owner, due date.\n- Map each clause to our procedures: [list or attach Document Master List].\nOutput: A4 Word document, landscape tables.", "bm": "Jana matriks pematuhan ISO 14001:2026 dan pelan tindakan peralihan untuk [organisasi].", "tip": "Attach your current procedure list so the mapping uses real document numbers."}, {"title": "Vendor / customer audit questionnaire", "use": "A customer sent an assessment form to fill in.", "prompt": "Fill in this supplier audit questionnaire from [customer].\nAnswer from our ISO manual and procedures (attached). For each answer, cite the procedure number as evidence.\nWhere we have no evidence, write 'To confirm' and list it for me at the end. Do not invent certificates or dates.\nKeep the original Excel format.", "bm": "Isi borang audit pembekal ni berdasarkan manual ISO dan prosedur kami. Tulis nombor prosedur sebagai bukti.", "tip": "The 'To confirm' list is the important part. Never let it guess."}, {"title": "Sync updated documents to master copies", "use": "Revised procedures and forms are ready to replace the masters.", "prompt": "Check '02 Documents Under Revision' for updated procedures and forms.\nList each one with the master copy it replaces, old and new revision numbers.\nWait for my approval. Then replace the masters, move old ones to OBSOLETE, and update the Document Master List 2026, the three Forms Registers and the pending task list.", "bm": "Semak dokumen dalam 'Under Revision', senaraikan padanan dengan master copy. Tunggu kelulusan saya sebelum tukar.", "tip": "The approval step protects you from overwriting a controlled document by mistake."}, {"title": "COC Word to Excel", "use": "Certificate of Conformance as an Excel template.", "prompt": "Convert this Certificate of Conformance (.docx) to Excel. Keep the exact format: Times New Roman, same font sizes, no borders, company header at the top. Make it reusable as a template.", "bm": "Tukar COC Word ni ke Excel, kekalkan format yang sama.", "tip": ""}, {"title": "Explain a regulation simply", "use": "New law or standard you need to understand fast.", "prompt": "Explain [regulation, e.g. EU PPWR 2025/40 / Scheduled Waste SW409] for a plastic packaging manufacturer in Malaysia.\n1) What it requires, in plain words.\n2) What it means for us, with examples.\n3) A checklist of actions with deadlines.\nCite your sources and say clearly what you are not sure about.", "bm": "Terangkan [peraturan] dengan mudah untuk kilang pembungkusan plastik di Malaysia. Sertakan senarai semak tindakan.", "tip": ""}]}, {"id": "meetings", "name": "Meetings & reports", "blurb": "Minutes, monthly environmental reports and KPI evaluations in the company template.", "prompts": [{"title": "Meeting minutes (JKK / ERT / Environment)", "use": "From notes, a PDF or just a date and topics.", "prompt": "Create [JKK safety / ERT / environmental] meeting minutes for [date].\nAttendance: [present / absent, or 'same as last month except ...'].\nTopics and decisions: [notes or attach file].\nAgenda table columns: Bil, Agenda, Status, Est. Date, Completion Date, PIC.\nLanguage: [English / BM]. Output: A4 Word in the Impact Rank format.", "bm": "Buat minit mesyuarat [JKK] untuk [tarikh]. Kehadiran: [...]. Topik: [...]. Format Word A4 Impact Rank.", "tip": "You can give only the changes from last month. Attach last month's minutes."}, {"title": "EPMC minutes from a safety meeting", "use": "Pull only the environmental items out of the JKK minutes.", "prompt": "From this safety/JKK meeting PDF, extract only the environmental and scheduled waste items (SW409, SW410, SW307, DOE) and create the EPMC meeting minutes.\nPrepared by Zuhairah, verified by CK Tan.", "bm": "Ambil item alam sekitar dan buangan terjadual sahaja dari minit JKK ni, buat minit EPMC.", "tip": ""}, {"title": "Monthly environmental performance report", "use": "Monthly report for the MD.", "prompt": "Prepare the Monthly Environmental Performance Report for [month year].\nData: scheduled waste status [..], DOE inspection [..], LEV/NRA/CHRA monitoring [..], incidents [..], training [..], KPI [..], energy/GHG [..].\nPrepared by Dr. Zuraidah, approved by James Chang.\nMark anything I didn't give you as 'No update' instead of guessing.", "bm": "Sediakan Laporan Prestasi Alam Sekitar Bulanan untuk [bulan]. Data: [...]. Kalau tiada data, tulis 'Tiada kemas kini'.", "tip": ""}, {"title": "KPI evaluation (bimonthly)", "use": "Fill the KPI workbook for a new period.", "prompt": "Fill the KPI Evaluation 2026 workbook for [period, e.g. Sep-Oct].\n- Fill criteria scores from [attached data].\n- Update the Overall sheet, check every value matches the right name.\n- Add strength and weakness remarks per person.\n- Result by quartile per group, and top 10 by category.\n- A one-page notice board summary.\nList any name or score that doesn't match before saving.", "bm": "Isi KPI Evaluation untuk [tempoh]. Pastikan nilai betul dengan nama. Buat top 10 setiap kategori.", "tip": "'Make sure value is correct with the name' is worth always adding."}]}, {"id": "production", "name": "Production & stock", "blurb": "ERP exports in, clean Excel and Word reports out.", "prompts": [{"title": "Production log: convert + Sheet 3 + Sheet 6", "use": "Monthly extruder production log.", "prompt": "Here is the [month] raw production log (Format A) and the energy log.\n1) Convert to clean Format B, one row per entry.\n2) Sheet 3: output kg by width category (Narrow/Medium/Wide) x machine.\n3) Sheet 6: daily production detail with energy.\nTell me how many rows you dropped and why, and check the totals match the raw file.", "bm": "Ni log pengeluaran [bulan]. Tukar ke Format B, buat Sheet 3 dan Sheet 6. Pastikan jumlah sama dengan fail asal.", "tip": "Uses the production-suite skill."}, {"title": "Monthly production performance report", "use": "Word report with charts for management.", "prompt": "Create the Production Performance Report for [month] from the attached data.\nSame template as before: cover page with logo and two comparison charts, Extrusion and Cutting sections 1.0-4.0 (material productivity, wastage, overall performance, labour productivity).\nCompare with [last month] and highlight the 3 biggest changes.", "bm": "Buat laporan prestasi pengeluaran bulan [bulan]. Bandingkan dengan bulan lepas.", "tip": ""}, {"title": "Stock take count sheet", "use": "ERP stock take PDF is too small to read on the floor.", "prompt": "Make a stock take count sheet from this ERP Stock Take Report PDF.\nBlack and white, bigger Lot # and Qty, blank 'Stock Take Qty' column, keep the ERP header on every page.\nAlso give me the Excel key-in version with variance formulas.", "bm": "Buat borang kira stok dari PDF ni. Hitam putih, tulisan besar, ada versi Excel untuk key-in.", "tip": ""}, {"title": "Stock take variance + old stock reports", "use": "After the count.", "prompt": "From the stock take issues document, create a concise 2-3 page Stock Take Variance Report for the MD.\nThen from the stock valuation Excel and customer-partcode mapping, create the Old Stock Report by salesman with aging (days in stock).\nFinally file all outputs into the right YYYY-MM folders.", "bm": "Buat laporan varians stock take (ringkas untuk MD), laporan old stock ikut salesman, dan failkan ikut folder bulan.", "tip": "Three skills run in order: variance report, old stock report, monthly filing."}, {"title": "FG stock from Part Master Listing", "use": "Huge ERP PDF, you only want items with stock.", "prompt": "Extract finished goods from this Part Master Listing PDF into Excel. Only Qty On Hand above zero. Add Customer Name from the mapping file. Limit to parts in store [store] using the Part Location Listing.", "bm": "Ekstrak stok FG dari Part Master Listing, qty lebih dari kosong sahaja, tambah nama pelanggan.", "tip": ""}]}, {"id": "training", "name": "Training modules", "blurb": "Modules for new staff, from your procedures.", "prompts": [{"title": "Training module from procedures", "use": "New staff training on any topic.", "prompt": "Create training module [number] on [topic] for new [Engineering Dept] staff, from the attached procedures [IR-HM-xx / IR-PP-xx].\nInclude: learning objectives, simple explanations, real examples from our factory, do's and don'ts, a 10-question quiz with answer key, and a sign-off page.\nLanguage: [English / BM]. Output: Word A4.", "bm": "Buat modul latihan [nombor] tentang [topik] untuk staf baru, berdasarkan prosedur yang dilampirkan. Sertakan kuiz 10 soalan.", "tip": "Say 'next module' to continue the series in the same format."}, {"title": "Quiz and flashcards", "use": "Check understanding after training.", "prompt": "From this training module, make 15 quiz questions (mix of multiple choice and true/false) and 10 flashcards. Easy language for production operators. Answer key at the end.", "bm": "Dari modul ni, buat 15 soalan kuiz dan 10 kad imbas. Bahasa mudah untuk operator.", "tip": ""}]}, {"id": "writing", "name": "Writing, proofreading & translation", "blurb": "Your academic voice, tracked-change proofreading, DBP-standard Malay.", "prompts": [{"title": "Write it in my style", "use": "Formal reports, FTR sections, letters.", "prompt": "Write [section / letter / report] about [topic] in my style.\nFull formal paragraphs (no bullet lists), clear topic sentences, precise transitions (However, Therefore, In addition), like my PhD thesis.\nUse only the facts I give: [facts].", "bm": "Tulis [bahagian] tentang [topik] dalam gaya penulisan saya, macam tesis PhD saya.", "tip": "'Make it sound like me' also works."}, {"title": "Proofread with tracked changes", "use": "Check a Word document without losing the format.", "prompt": "Proofread this Word document. Every correction as a tracked change (author: Zuraidah). Put logic or unclear points as Word comments. Do not change the formatting.", "bm": "Semak dokumen ni. Semua pembetulan sebagai tracked change, isu logik sebagai komen.", "tip": ""}, {"title": "Translate to proper Bahasa Melayu", "use": "Word, Excel or PowerPoint into BM.", "prompt": "Translate this [Word / Excel / PowerPoint] file into standard Bahasa Melayu (DBP standard, Kamus Dewan). Keep technical terms correct for manufacturing and ISO. Keep the same file format and layout. List any term you weren't sure about.", "bm": "Terjemah fail ni ke Bahasa Melayu standard DBP. Kekalkan format asal.", "tip": ""}, {"title": "Sales proposal", "use": "Customer-facing proposal from the company profile.", "prompt": "Build a customer-facing sales proposal from this company profile for [customer / industry].\nUpdate: contact [..], employee count [..], customer list [..].\nOutput: Word document in the Impact Rank proposal structure.", "bm": "Buat proposal jualan untuk [pelanggan] dari company profile ni.", "tip": ""}]}, {"id": "career", "name": "Career", "blurb": "Job search and your professional profile.", "prompts": [{"title": "Screen job postings", "use": "Many job tabs open, need a shortlist.", "prompt": "Screen the job postings open in my Chrome against my resume. Score each 0-100, close tabs below [70], keep the strong ones open, and give me a ranked shortlist with one line on why each fits.", "bm": "Tapis iklan kerja dalam Chrome ikut resume saya. Bagi markah 0-100 dan senarai pendek.", "tip": ""}, {"title": "Tailor resume to a job", "use": "Before applying.", "prompt": "Here is the job ad: [paste]. Here is my resume: [attach].\nShow me: the 5 requirements that matter most, where my resume already proves them, the gaps, and a tailored version of my summary and top bullet points. Do not add experience I don't have.", "bm": "Ni iklan kerja dan resume saya. Tunjuk kekuatan, jurang, dan versi resume yang disesuaikan.", "tip": ""}]}, {"id": "game", "name": "Rumah Kita game & apps", "blurb": "Building, editing and documenting your game with Claude Code.", "prompts": [{"title": "Move an artifact into GitHub", "use": "A game or page you built in Claude chat should live in your repo.", "prompt": "Move my [Rumah Kita game] from this Claude artifact into my GitHub repo [repo name]: [artifact link].\nKeep every file, image and folder. Add a README in Malay explaining how to run and edit it.\nTell me the total size, then commit and push.", "bm": "Pindahkan game [Rumah Kita] dari artifact Claude ke repo GitHub saya. Simpan semua fail dan gambar, tambah README.", "tip": "First ask 'What is GitHub and why use it with Claude Code?' if you're new to it."}, {"title": "Share the game with others (GitHub Pages)", "use": "Give people a link to play.", "prompt": "I want other people to play my game from a link, and their saved games to keep working.\n1) Explain where saves are stored now and what changes on GitHub Pages.\n2) Set up GitHub Pages for this repo.\n3) Give me the exact clicks I must do myself in GitHub settings, step by step, for the iPhone app or browser.\nThen check the link works.", "bm": "Saya nak orang lain boleh main game ni dari link dan simpanan game kekal. Sediakan GitHub Pages dan ajar saya langkah yang perlu saya buat sendiri.", "tip": "Saves in localStorage stay on each player's own phone. Ask for 'export / import save file' if players need to move saves."}, {"title": "Rename or reorganise the repo", "use": "Repo has the wrong name.", "prompt": "I want this game in its own repo named [rumah-kita-game]. Tell me exactly what to click to rename or create it, wait for me to say 'done', then check it worked and move the code there.", "bm": "Saya nak game ni dalam repo sendiri bernama [rumah-kita-game]. Ajar langkah, tunggu saya cakap 'done', kemudian semak.", "tip": "'Wait for me to say done' stops Claude from guessing while you click."}, {"title": "Edit the game", "use": "New feature, fix or content change.", "prompt": "Edit my Rumah Kita game: [change, e.g. add a new room / fix the save button / new dialogue for Nadia].\nShow me the plan first, keep the hand-drawn style, test it on a phone-size screen, then commit and push.", "bm": "Edit game Rumah Kita: [perubahan]. Tunjuk rancangan dulu, kekalkan gaya lukisan tangan, uji pada saiz telefon.", "tip": "Attach a screenshot of the part you want changed."}, {"title": "Game design document", "use": "Keep every requirement in one place.", "prompt": "Collect all the updated requirements and the text you wrote to build this game into one Word document: story, characters, rooms, rules, save system, art style, and a change log. Put it in the repo under docs/.", "bm": "Simpan segala keperluan terkini dan teks dari Claude untuk bina game ni dalam dokumen Word, letak dalam repo.", "tip": "Run this at the end of every big build session so nothing is lost."}]}, {"id": "claude", "name": "Getting more from Claude", "blurb": "Prompts about Claude itself: skills, routines and setup.", "prompts": [{"title": "Turn a good chat into a skill", "use": "You did something once and want it the same way every time.", "prompt": "Turn what we just did into a skill so next time I can just say '[trigger phrase]'.\nInclude the steps, the file format, the rules I gave you, and the approval point. Test it on [example].", "bm": "Jadikan apa yang kita buat tadi sebagai skill supaya lain kali saya cuma sebut '[frasa]'.", "tip": "This is how most of the prompts in this book became one-liners."}, {"title": "Weekly routine", "use": "Something you do every week or month.", "prompt": "Every [Monday 8am], [do task, e.g. pick a carousel topic I haven't covered and draft it]. Don't publish anything. Send me the draft to approve.", "bm": "Setiap [Isnin 8 pagi], [buat tugasan]. Jangan publish, hantar draf untuk saya luluskan.", "tip": ""}, {"title": "Save everything to a document", "use": "End of a long build session.", "prompt": "Save all the updated requirements and decisions from this chat into a Word document: what we built, the final rules, open questions, and next steps. Then commit it to my GitHub repo.", "bm": "Simpan semua keperluan terkini dan keputusan dari chat ni dalam dokumen Word, dan commit ke GitHub.", "tip": ""}, {"title": "Improve my prompt", "use": "Before a big task.", "prompt": "Here is my prompt: [paste]. Rewrite it using Role, Task, Input, Output, Rules and Checkpoint. Ask me up to 3 questions about anything missing first.", "bm": "Baiki prompt saya ni ikut Role, Task, Input, Output, Rules, Checkpoint. Tanya saya 3 soalan dulu kalau ada yang kurang.", "tip": ""}]}]};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mark = s => esc(s).replace(/\[[^\]\n]+\]/g, m => `<span class="ph">${m}</span>`);

$("#subtitle").textContent = DATA.subtitle;
$("#f-name").textContent = DATA.formula.name;
$("#f-intro").textContent = DATA.formula.intro;
$("#parts").innerHTML = DATA.formula.parts.map(([p, m, e]) =>
  `<div class="part"><strong>${esc(p)}</strong><span>${esc(m)}</span><em>${esc(e)}</em></div>`).join("");

let active = "all";
const tabs = $("#tabs");
const chips = [{ id: "all", name: "All", n: DATA.chapters.reduce((a, c) => a + c.prompts.length, 0) }]
  .concat(DATA.chapters.map(c => ({ id: c.id, name: c.name, n: c.prompts.length })));
chips.forEach(c => {
  const b = document.createElement("button");
  b.className = "chip"; b.id = "chip-" + c.id; b.dataset.id = c.id;
  b.setAttribute("aria-pressed", c.id === "all");
  b.innerHTML = `${esc(c.name)}<span class="n">${c.n}</span>`;
  b.onclick = () => { active = c.id; render(); };
  tabs.appendChild(b);
});

const lang = {};
function render() {
  const q = $("#q").value.trim().toLowerCase();
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === active));
  let html = "";
  DATA.chapters.forEach((c, i) => {
    if (active !== "all" && active !== c.id) return;
    const items = c.prompts.map((p, j) => ({ p, key: `${i + 1}.${j + 1}` })).filter(({ p }) =>
      !q || [p.title, p.use, p.prompt, p.bm || "", p.tip || ""].join(" ").toLowerCase().includes(q));
    if (!items.length) return;
    html += `<section class="chapter" id="${c.id}"><div class="ch-head"><span class="ch-num">${String(i + 1).padStart(2, "0")}</span><h2>${esc(c.name)}</h2></div><p class="ch-blurb">${esc(c.blurb)}</p>`;
    items.forEach(({ p, key }) => {
      const l = lang[key] || "en";
      const text = l === "bm" && p.bm ? p.bm : p.prompt;
      html += `<article class="card"><div class="card-top"><h3><span class="id">${key}</span>${esc(p.title)}</h3>` +
        (p.bm ? `<div class="lang" role="group" aria-label="Language"><button data-k="${key}" data-l="en" aria-pressed="${l === "en"}">EN</button><button data-k="${key}" data-l="bm" aria-pressed="${l === "bm"}">BM</button></div>` : "") +
        `</div><p class="use">Use when: ${esc(p.use)}</p><pre id="p-${key}">${mark(text)}</pre>` +
        `<div class="row"><div class="tip">${p.tip ? `<b>Tip:</b> ${esc(p.tip)}` : ""}</div><button class="copy" data-k="${key}">Copy prompt</button></div></article>`;
    });
    html += "</section>";
  });
  $("#book").innerHTML = html || `<p class="empty">No prompts match "${esc(q)}". Try a shorter word, like "video" or "minit".</p>`;
}

$("#book").addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.l) { lang[t.dataset.k] = t.dataset.l; render(); return; }
  if (t.classList.contains("copy")) {
    const pre = document.getElementById("p-" + t.dataset.k);
    const done = () => { t.textContent = "Copied"; t.classList.add("done"); setTimeout(() => { t.textContent = "Copy prompt"; t.classList.remove("done"); }, 1600); };
    const select = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected, press copy"; };
    try { navigator.clipboard.writeText(pre.textContent).then(done, select); } catch (err) { select(); }
  }
});
$("#q").addEventListener("input", () => { if ($("#q").value) active = "all"; render(); });

const h = location.hash.slice(1);
if (DATA.chapters.some(c => c.id === h)) active = h;
render();
</script>

</body></html>
