}

:root{color-scheme:light}

*{box-sizing:border-box}

body{font-family:var(--font-body);font-size:15px;padding-inline:16px;padding-block:14px 32px}

.app{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.rc table{width:100%;border-collapse:collapse;margin:6px 0;font-size:.85rem}.rc td{padding:3px 4px;border-bottom:1px solid var(--line,rgba(0,0,0,.08))}.rc td:nth-child(2),.rc td:nth-child(3){text-align:right;width:3.2em}.rc .gA{color:var(--good)}.rc .gF,.rc .gD{color:var(--bad)}
