<style>
/* Layout: game console — status bar, family strip, isometric terrace-house canvas, tabbed drawer (Needs / Goals / Career / Buy / Family) below on phones and beside it on desktop */
:root{
  --bg:#e8efeb; --panel:#fbfdfc; --stage:#d6e3dc; --ink:#1b2925; --muted:#5a6d67; --line:#cdd9d3; --chip:#e1eae5;
  --accent:#23744f; --accent-ink:#ffffff; --pink:#c84d74; --gold:#b98512;
  --good:#2f9a5c; --warn:#d68d25; --bad:#c8453a;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root[data-theme="dark-auto-off"]{
  --bg:#111a17; --panel:#18231f; --stage:#0d1512; --ink:#e4eee9; --muted:#97aba4; --line:#2a3833; --chip:#22302b;
  --accent:#3fa774; --accent-ink:#06130d; --pink:#e07796; --gold:#e2b54a; --good:#4cbc7a; --warn:#e6a548; --bad:#e2685c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a17; --panel:#18231f; --stage:#0d1512; --ink:#e4eee9; --muted:#97aba4; --line:#2a3833; --chip:#22302b;
  --accent:#3fa774; --accent-ink:#06130d; --pink:#e07796; --gold:#e2b54a; --good:#4cbc7a; --warn:#e6a548; --bad:#e2685c; color-scheme:dark}
:root{color-scheme:light}
.dr-hero .btn,.dr-hero .chip{color:var(--ink)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;padding-inline:16px;padding-block:14px 32px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{flex:none}
h1{font-family:var(--font-display);font-weight:800;font-size:1.65rem;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:3px 0 0;color:var(--muted);font-size:.82rem}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 11px;font-variant-numeric:tabular-nums}
.clock b{font-family:var(--font-display);font-size:1.3rem;font-weight:700}
.clock span,.clock small{color:var(--muted);font-size:.8rem;font-weight:600}
.money{font-family:var(--font-display);font-weight:800;font-size:1.2rem;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:5px 13px;font-variant-numeric:tabular-nums}
.money.neg{background:var(--bad)}
.speed{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.speed button{border:0;background:none;border-radius:9px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:.85rem;min-width:38px}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.famstrip{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.members{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.mem{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer}
.mem[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mem .av{width:30px;height:30px;font-size:.85rem}
.mem .mt{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.mem b{font-size:.82rem}.mem small{font-size:.7rem;color:var(--muted);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.floors{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.floors button{border:0;background:none;border-radius:9px;padding:5px 10px;font-weight:700;cursor:pointer;font-size:.8rem}
.floors button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.floors button:disabled{opacity:.4;cursor:not-allowed}
.stage{position:relative;background:var(--stage);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;touch-action:manipulation;cursor:pointer}
.menu{position:absolute;width:210px;max-height:80%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:6px;z-index:6;display:flex;flex-direction:column;gap:2px}
.menu .m-title{font-family:var(--font-display);font-weight:700;font-size:.95rem;padding:4px 8px 2px}
.menu .m-sub{color:var(--muted);font-size:.75rem;padding:0 8px 4px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-size:.86rem;font-weight:600}
.menu button:hover:not(:disabled){background:var(--chip)}
.menu button:disabled{opacity:.42;cursor:not-allowed}
.menu small{color:var(--muted);font-weight:500;font-size:.72rem;white-space:nowrap}
#toasts{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none;z-index:4}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.82rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:100%;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.banner{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px 8px 12px;font-size:.84rem;font-weight:600;z-index:3}
.banner button{border:0;border-radius:8px;padding:5px 10px;background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.modal{position:absolute;inset:0;background:rgba(10,18,15,.55);display:grid;place-items:center;padding:16px;z-index:8}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.mcard h3{font-family:var(--font-display);font-size:1.25rem;margin:0;line-height:1.1}
.mcard p{margin:0;font-size:.88rem;line-height:1.45}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:700;font-size:.88rem}
.choice:hover{border-color:var(--accent)}
.choice small{color:var(--muted);font-weight:600;white-space:nowrap}
.now{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 10px;min-height:52px}
.cur{display:flex;align-items:center;gap:9px;flex:1 1 220px;min-width:0}
.cur .ic{font-size:1.3rem;width:32px;height:32px;display:grid;place-items:center;background:var(--chip);border-radius:10px;flex:none}
.cur .txt{min-width:0;flex:1}
.cur .lbl{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur .sub{color:var(--muted);font-size:.75rem}
.prog{height:5px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.x{border:0;background:var(--chip);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:.78rem}
.queue{display:flex;gap:5px;flex-wrap:wrap}
.qchip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 8px 3px 6px;font-size:.78rem;cursor:pointer;font-weight:600}
.qchip:hover{border-color:var(--bad)}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:11px 2px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding:14px;display:flex;flex-direction:column;gap:14px}
.h{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:0;line-height:1.15}
.cap{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.moodrow{display:flex;align-items:center;gap:12px}
.moodbadge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.15rem;color:#fff;flex:none;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center;font-size:.84rem;font-weight:600}
.tr{height:10px;background:var(--chip);border-radius:9px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:9px;transition:width .3s}
.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.diary{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.82rem}
.diary li{display:grid;grid-template-columns:62px 1fr;gap:6px}
.diary time{color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;font-weight:700;font-size:.8rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.jobtitle{font-family:var(--font-display);font-size:1.35rem;font-weight:800;line-height:1.05}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.req{display:flex;gap:6px;flex-wrap:wrap}
.waph{font-size:3rem;line-height:1;text-align:center;background:var(--chip);border-radius:10px;padding:14px 0;margin:4px 0}
.kvwrap{padding:0 12px 12px}.kvwrap>svg{width:100%;height:auto;border-radius:12px;display:block}
.roomchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}.roomchips button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:6px 10px;font-weight:700;font-size:.76rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;cursor:pointer}.roomchips button span{font-size:1.1rem}.roomchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dr-hero{margin:0 12px 10px;border-radius:14px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#3a1020,#7a1f2e 55%,#c9a441)}.dr-hero h3{margin:2px 0 4px;font-size:1.15rem}.dr-hero p{margin:0;opacity:.92;line-height:1.45}.dr-ppl{display:flex;gap:6px;margin-top:8px}.dr-ppl .av{width:44px;height:58px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.15)}.dr-ch{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}.dr-ch button{text-align:left}
.wabadge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:800;text-align:center;margin-left:5px;padding:0 4px}
.walist{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;background:color-mix(in srgb,var(--good) 7%,var(--panel))}
.wam{max-width:86%;align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:6px 10px;font-size:.9rem;line-height:1.35}
.wam.me{align-self:flex-end;border-radius:12px 4px 12px 12px;background:color-mix(in srgb,var(--good) 20%,var(--panel))}
.wam b{display:block;font-size:.76rem}.wam time{display:block;text-align:right;font-size:.68rem;opacity:.6;margin-top:2px}
.waday{align-self:center;font-size:.72rem;opacity:.7;background:var(--chip);border-radius:8px;padding:2px 8px}
